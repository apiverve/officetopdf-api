openapi: 3.0.4
info:
  title: Office to PDF
  description: >-
    Office to PDF converts Word, Excel, PowerPoint, OpenDocument, RTF, text and
    CSV files to PDF and returns a download link valid for 2 days, with the page
    count of the result. Upload the file or send its URL. Paid plans can convert
    only selected pages and set landscape orientation.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/officetopdf:
    post:
      summary: Office to PDF
      description: Convert an uploaded office document, or one at a URL, to PDF
      operationId: officetopdf
      parameters:
        - name: pageRanges
          in: query
          schema:
            type: string
          required: false
          description: >-
            Pages to convert, such as 1-3,5. Converts the whole document when
            omitted
          example: 1-2
        - name: landscape
          in: query
          schema:
            type: boolean
          required: false
          description: Lay the pages out in landscape orientation
          example: false
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  pdfName: 8f3c2a51-6d0e-4b7a-9c1f-2e5d7a9b4c10.pdf
                  inputName: SampleDoc.docx
                  inputFormat: docx
                  pageCount: 2
                  landscape: false
                  pageRanges: null
                  size: 23654
                  expires: 1792400000000
                  downloadURL: https://storage.googleapis.com/apiverve/APIData/officetopdf/8f3c2a51-6d0e-4b7a-9c1f-2e5d7a9b4c10.pdf?GoogleAccessId=635500398038-compute%40developer.gserviceaccount.com&Expires=1792400000&Signature=SAMPLE
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
                  description: >-
                    File to upload (accepted: .doc, .docx, .xls, .xlsx, .ppt,
                    .pptx, .odt, .ods, .odp, .rtf, .txt, .csv, max 10MB)
                  x-acceptedTypes:
                    - .doc
                    - .docx
                    - .xls
                    - .xlsx
                    - .ppt
                    - .pptx
                    - .odt
                    - .ods
                    - .odp
                    - .rtf
                    - .txt
                    - .csv
                  x-maxSizeMB: 10
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  document: https://raw.githubusercontent.com/apache/poi/trunk/test-data/document/SampleDoc.docx
